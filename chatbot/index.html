<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 챗봇 접속</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       background:#eef1f7;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#222;padding:20px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 18px rgba(0,0,0,.08);
        padding:30px 26px;max-width:420px;width:100%;text-align:center}
  h1{font-size:21px;margin:0 0 6px}
  .sub{color:#667;font-size:14px;margin:0 0 22px}
  a.go{display:block;background:#2d5be3;color:#fff;text-decoration:none;
       padding:15px;border-radius:10px;font-size:17px;font-weight:bold}
  a.go:hover{background:#2449b8}
  .msg{font-size:14px;line-height:1.7;color:#445}
  .err{background:#fff4f4;border:1px solid #f0c4c4;border-radius:10px;padding:16px;
       font-size:14px;line-height:1.7;color:#8a3030;text-align:left}
  .when{color:#8a94a6;font-size:12.5px;margin-top:16px}
  code{background:#f1f3f8;padding:2px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>수업 챗봇</h1>
  <p class="sub">잠시 후 챗봇으로 이동합니다</p>
  <div id="body"><p class="msg">주소를 확인하는 중…</p></div>
  <p class="when" id="when"></p>
</div>
<script>
// 젯슨이 부팅할 때마다 url.json 에 오늘의 주소를 올린다.
// 이 페이지 주소는 바뀌지 않으므로, 학생들은 이 주소만 알면 된다.
const $ = id => document.getElementById(id);

function fail(html) {
  $('body').innerHTML = '<div class="err">' + html + '</div>';
}

fetch('url.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('url.json 없음'); return r.json(); })
  .then(d => {
    if (!d.url) throw new Error('주소가 비어 있음');
    $('body').innerHTML =
      '<a class="go" href="' + d.url + '">챗봇 열기 →</a>' +
      '<p class="msg" style="margin-top:14px">자동으로 이동하지 않으면 위 단추를 누르세요.</p>';
    if (d.updated) $('when').textContent = '주소 갱신: ' + d.updated;
    setTimeout(() => { location.href = d.url; }, 1200);
  })
  .catch(() => {
    fail('<b>지금은 챗봇이 꺼져 있습니다.</b><br>' +
         '젯슨 전원과 랜선을 확인해 주세요. ' +
         '젯슨이 켜지면 이 페이지가 자동으로 새 주소를 안내합니다.');
  });
</script>
</body>
</html>
