name: Deploy to GitHub Pages

# 기본 브랜치에 푸시되면 정적 사이트를 GitHub Pages로 배포한다.
# 수동 실행(workflow_dispatch)도 지원한다.
on:
  push:
    branches: [claude/zen-hawking-oh0vre]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지: 진행 중인 배포는 취소하지 않고 큐잉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # Pages가 꺼져 있어도 토큰 권한으로 자동 활성화
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        # 저장소 루트 전체를 그대로 업로드(정적 사이트)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
