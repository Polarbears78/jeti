<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Pico 온도 측정</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0;
    --muted:#94a3b8; --temp:#fb7185; --ok:#34d399; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
  header{text-align:center;padding:22px 16px 6px;}
  header h1{margin:0;font-size:1.35rem;letter-spacing:-0.02em;}
  header p{margin:6px 0 0;color:var(--muted);font-size:0.85rem;}
  main{max-width:480px;margin:0 auto;padding:14px 16px 36px;}

  .status{display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:0.82rem;color:var(--muted);margin:6px 0 14px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .dot.err{background:var(--warn);box-shadow:0 0 8px var(--warn);}

  .big{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:22px;text-align:center;margin-bottom:14px;}
  .big .val{font-size:3.2rem;font-weight:800;color:var(--temp);line-height:1;}
  .big .unit{font-size:1.2rem;color:var(--muted);margin-left:4px;}
  .big .rec{margin-top:10px;font-size:0.8rem;color:var(--muted);}
  .big .rec.live{color:var(--temp);}

  .btn-row{display:flex;gap:10px;margin-bottom:12px;}
  button{flex:1;padding:15px 10px;font-size:1rem;font-weight:700;border-radius:14px;
    border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;
    transition:transform .1s ease,opacity .1s ease;}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:default;}
  button.start{background:var(--ok);color:#06281c;border-color:transparent;}
  button.stop{background:var(--temp);color:#3a0d16;border-color:transparent;}
  button.save{background:#38bdf8;color:#04263a;border-color:transparent;}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 8px;text-align:center;}
  .card .label{font-size:0.7rem;color:var(--muted);display:block;}
  .card .num{font-size:1.15rem;font-weight:700;margin-top:4px;display:block;}

  .graph-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:12px;margin-bottom:14px;}
  .graph-wrap h2{margin:0 0 8px;font-size:0.9rem;}
  canvas{width:100%;height:180px;display:block;}

  .note{font-size:0.78rem;color:var(--muted);line-height:1.5;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .note b{color:var(--text);}
</style>
</head>
<body>
  <header>
    <h1>🌡️ Pico 온도 측정 <span style="font-size:0.7rem;color:var(--muted);vertical-align:middle;border:1px solid var(--line);border-radius:999px;padding:2px 8px;">temp-01</span></h1>
    <p>방수 온도센서(DS18B20) · 실시간 기록</p>
  </header>

  <main>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">센서 연결 확인 중…</span>
    </div>

    <div class="big">
      <div><span class="val" id="tempVal">--.-</span><span class="unit">°C</span></div>
      <div class="rec" id="recText">대기 중 · ‘시작’을 누르면 기록을 시작합니다</div>
    </div>

    <div class="btn-row">
      <button class="start" id="startBtn">▶ 시작</button>
      <button class="stop" id="stopBtn" disabled>■ 정지</button>
    </div>
    <div class="btn-row">
      <button class="save" id="saveBtn" disabled>💾 CSV 파일로 저장</button>
      <button id="clearBtn" disabled>🗑 기록 비우기</button>
    </div>

    <div class="cards">
      <div class="card"><span class="label">측정 개수</span><span class="num" id="countVal">0</span></div>
      <div class="card"><span class="label">측정 시간</span><span class="num" id="timeVal">0초</span></div>
      <div class="card"><span class="label">최저 / 최고</span><span class="num" id="minmaxVal">- / -</span></div>
    </div>

    <div class="graph-wrap">
      <h2>온도–시간 그래프</h2>
      <canvas id="graph"></canvas>
    </div>

    <p class="note">
      💡 <b>시작</b>을 누르면 약 1초마다 온도를 받아 기록하고, <b>정지</b>를 누르면 멈춥니다.
      이후 <b>CSV 파일로 저장</b>을 누르면 측정한 데이터를 표 파일(.csv)로 내려받아
      엑셀·구글시트에서 열어 볼 수 있습니다.
    </p>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const dot = $("dot"), statusText = $("statusText");
const tempVal = $("tempVal"), recText = $("recText");
const startBtn = $("startBtn"), stopBtn = $("stopBtn");
const saveBtn = $("saveBtn"), clearBtn = $("clearBtn");
const countVal = $("countVal"), timeVal = $("timeVal"), minmaxVal = $("minmaxVal");
const canvas = $("graph"), ctx = canvas.getContext("2d");

let running = false;
let timer = null;
let startTime = 0;
let data = [];           // {sec, temp} 기록
let latestTemp = null;
const INTERVAL = 1000;   // 1초마다 측정 (config.py의 SAMPLE_INTERVAL_MS와 맞추세요)

// ----- 센서/서버에서 온도 받기 -----
async function fetchTemp() {
  try {
    const r = await fetch("/temp", { cache: "no-store" });
    const j = await r.json();
    if (!j.sensor) {
      setStatus("err", "센서를 찾지 못했습니다 (배선 확인)");
      return null;
    }
    if (j.temp === null) {
      setStatus("on", "센서 준비 중…");
      return null;
    }
    setStatus("on", "센서 연결됨");
    latestTemp = j.temp;
    return j.temp;
  } catch (e) {
    setStatus("err", "Pico 서버에 연결할 수 없습니다");
    return null;
  }
}

function setStatus(cls, text) {
  dot.className = "dot " + cls;
  statusText.textContent = text;
}

function fmt(t) { return (t === null || t === undefined) ? "--.-" : t.toFixed(1); }

// ----- 측정 루프 -----
async function tick() {
  const t = await fetchTemp();
  tempVal.textContent = fmt(t);
  if (running && t !== null) {
    const sec = (Date.now() - startTime) / 1000;
    data.push({ sec: +sec.toFixed(2), temp: +t.toFixed(2) });
    updateStats();
    drawGraph();
  }
}

function updateStats() {
  countVal.textContent = data.length;
  if (data.length) {
    const last = data[data.length - 1].sec;
    timeVal.textContent = last.toFixed(0) + "초";
    const temps = data.map(d => d.temp);
    const mn = Math.min(...temps), mx = Math.max(...temps);
    minmaxVal.textContent = mn.toFixed(1) + " / " + mx.toFixed(1);
  }
}

// ----- 그래프 -----
function drawGraph() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 격자
  ctx.strokeStyle = "rgba(148,163,184,0.18)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = (h - 24) * i / 4 + 6;
    ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(w - 6, y); ctx.stroke();
  }
  if (data.length < 1) return;

  const temps = data.map(d => d.temp);
  let mn = Math.min(...temps), mx = Math.max(...temps);
  if (mx - mn < 1) { mn -= 0.5; mx += 0.5; }
  const pad = (mx - mn) * 0.1; mn -= pad; mx += pad;
  const t0 = data[0].sec, t1 = data[data.length - 1].sec;
  const span = Math.max(1, t1 - t0);

  const X = (s) => 34 + (w - 40) * (s - t0) / span;
  const Y = (v) => 6 + (h - 24) * (1 - (v - mn) / (mx - mn));

  // 축 라벨
  ctx.fillStyle = "rgba(148,163,184,0.85)";
  ctx.font = "10px sans-serif"; ctx.textAlign = "right";
  ctx.fillText(mx.toFixed(1), 30, 12);
  ctx.fillText(mn.toFixed(1), 30, h - 14);

  // 곡선
  ctx.strokeStyle = "#fb7185"; ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = X(d.sec), y = Y(d.temp);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();

  // 마지막 점
  const last = data[data.length - 1];
  ctx.fillStyle = "#fb7185";
  ctx.beginPath(); ctx.arc(X(last.sec), Y(last.temp), 3.5, 0, 7); ctx.fill();
}

// ----- 버튼 -----
startBtn.addEventListener("click", () => {
  data = [];
  running = true;
  startTime = Date.now();
  startBtn.disabled = true; stopBtn.disabled = false;
  saveBtn.disabled = true; clearBtn.disabled = true;
  recText.textContent = "● 기록 중…"; recText.classList.add("live");
  updateStats(); drawGraph();
});

stopBtn.addEventListener("click", () => {
  running = false;
  startBtn.disabled = false; stopBtn.disabled = true;
  saveBtn.disabled = data.length === 0;
  clearBtn.disabled = data.length === 0;
  recText.textContent = "정지됨 · 측정 " + data.length + "개 · CSV로 저장할 수 있습니다";
  recText.classList.remove("live");
});

clearBtn.addEventListener("click", () => {
  data = []; updateStats(); drawGraph();
  saveBtn.disabled = true; clearBtn.disabled = true;
  recText.textContent = "대기 중 · ‘시작’을 누르면 기록을 시작합니다";
});

saveBtn.addEventListener("click", () => {
  if (!data.length) return;
  let csv = "측정시각(초),온도(°C)\n";
  data.forEach(d => { csv += d.sec + "," + d.temp + "\n"; });
  // 엑셀 한글 깨짐 방지용 BOM 추가
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const now = new Date();
  const stamp = now.getFullYear() + ("0"+(now.getMonth()+1)).slice(-2) +
    ("0"+now.getDate()).slice(-2) + "_" + ("0"+now.getHours()).slice(-2) +
    ("0"+now.getMinutes()).slice(-2);
  a.href = url; a.download = "temperature_" + stamp + ".csv";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ----- 항상 도는 폴링 (대기 중에도 현재 온도 표시) -----
timer = setInterval(tick, INTERVAL);
tick();
drawGraph();
</script>
</body>
</html>
